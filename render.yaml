services:
  - type: web
    name: projeto-imobiliaria-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: DNS_SERVERS
        value: 8.8.8.8,1.1.1.1
